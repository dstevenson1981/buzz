# Agile36 team — one buzz-acp + Claude Code container per role.
# Runs alongside the official relay stack (deploy/compose), joining its network.
#
#   Build:  docker compose -f compose.agents.yml build
#   Start:  docker compose -f compose.agents.yml up -d
#
# Requires the relay stack to be up first (see ../compose) and a .env in this
# directory (see .env.example / setup.sh).

name: agile36-team

x-agent: &agent
  build:
    context: ../..
    dockerfile: deploy/agile36/Dockerfile.agents
  image: agile36/buzz-agent:latest
  # Row-zero host binding: the relay only accepts connections whose Host header
  # maps to a seeded community, and this deployment's community is
  # "localhost:3000". Sharing the relay container's network namespace makes
  # ws://localhost:3000 both routable and correctly named. On a VPS with a real
  # domain, drop this and use BUZZ_RELAY_URL=wss://<domain> instead.
  network_mode: "container:buzz-prod-relay-1"
  environment: &agent-env
    # Authority must byte-match the seeded community host — the desktop app's
    # managed-agent runner dials 127.0.0.1, so that's the canonical name.
    BUZZ_RELAY_URL: ws://127.0.0.1:3000
    BUZZ_ACP_AGENT_COMMAND: claude-agent-acp
    # Members-only relay, so "anyone" = Deadra + the other agents. This is what
    # lets agents answer each other, not just the owner.
    BUZZ_ACP_RESPOND_TO: anyone
    CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:?run 'claude setup-token' and put the token in .env}
  volumes:
    - ./personas:/personas:ro
  restart: unless-stopped

services:
  chief-of-staff:
    <<: *agent
    environment:
      <<: *agent-env
      BUZZ_PRIVATE_KEY: ${KEY_CHIEF_OF_STAFF:?}
      BUZZ_ACP_SYSTEM_PROMPT_FILE: /personas/chief-of-staff.md

  sales:
    <<: *agent
    environment:
      <<: *agent-env
      BUZZ_PRIVATE_KEY: ${KEY_SALES:?}
      BUZZ_ACP_SYSTEM_PROMPT_FILE: /personas/sales.md

  developer:
    <<: *agent
    environment:
      <<: *agent-env
      BUZZ_PRIVATE_KEY: ${KEY_DEVELOPER:?}
      BUZZ_ACP_SYSTEM_PROMPT_FILE: /personas/developer.md

  tester:
    <<: *agent
    environment:
      <<: *agent-env
      BUZZ_PRIVATE_KEY: ${KEY_TESTER:?}
      BUZZ_ACP_SYSTEM_PROMPT_FILE: /personas/tester.md

  social:
    <<: *agent
    environment:
      <<: *agent-env
      BUZZ_PRIVATE_KEY: ${KEY_SOCIAL:?}
      BUZZ_ACP_SYSTEM_PROMPT_FILE: /personas/social.md
