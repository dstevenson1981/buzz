# Builds the agile36/buzz-agent Docker image for linux/amd64 — the Hetzner
# VPS runs x86 while local builds on the Mac produce ARM. CI runners are
# amd64 with enough RAM for the Rust builder stage.
name: Agile36 agent image

on:
  workflow_dispatch:

jobs:
  build-amd64:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -f deploy/agile36/Dockerfile.agents -t agile36/buzz-agent:latest .

      - name: Save image
        run: docker save agile36/buzz-agent:latest | gzip > buzz-agent-amd64.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: buzz-agent-amd64
          path: buzz-agent-amd64.tar.gz
          if-no-files-found: error
